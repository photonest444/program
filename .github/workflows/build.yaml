name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true
      
      - name: Create dummy video
        run: New-Item -Path "video.mp4" -ItemType File -Force
      
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      
      - name: Collect all files
        run: |
          mkdir deploy
          copy target\x86_64-pc-windows-msvc\release\*.exe deploy\
          copy C:\Windows\System32\vcruntime140*.dll deploy\
          copy C:\Windows\System32\msvcp140*.dll deploy\
          copy C:\Windows\System32\concrt140.dll deploy\
          copy C:\Windows\System32\api-ms-win-crt-*.dll deploy\
          copy video.mp4 deploy\
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: full-package
          path: deploy/
          retention-days: 30
