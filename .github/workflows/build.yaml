name: Build Static Windows Tool

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: x86_64-pc-windows-msvc
        override: true
    
    - name: Build with static CRT
      run: |
        # Статическая линковка MSVCRT
        set RUSTFLAGS=-C target-feature=+crt-static -C relocation-model=static
        cargo build --release --target x86_64-pc-windows-msvc
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: static-binaries
        path: target/x86_64-pc-windows-msvc/release/*.exe
